[build]
  command = "bash scripts/netlify_build.sh"
  publish = "dist"

[[redirects]]
  from = "/convert"
  to = "https://gifmakerlive.onrender.com/convert"
  status = 200
  force = true

[[redirects]]
  from = "/download/*"
  to = "https://gifmakerlive.onrender.com/download/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://gifmakerlive.onrender.com/health"
  status = 200
  force = true
